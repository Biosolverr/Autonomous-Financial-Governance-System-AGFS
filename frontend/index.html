<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGFS — Autonomous Financial Governance System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #667eea;
      --violet: #764ba2;
      --green:  #28a745;
      --red:    #dc3545;
      --yellow: #ffc107;
      --blue:   #17a2b8;
      --gray:   #6c757d;
      --bg:     #f4f6fb;
      --card:   #ffffff;
      --radius: 14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--purple) 0%, var(--violet) 100%);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* ── Header ── */
    .header { text-align: center; color: #fff; margin-bottom: 28px; }
    .header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    .header p  { margin-top: 6px; opacity: 0.88; font-size: 1rem; }

    /* ── Connection banner ── */
    #conn-banner {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff; border-radius: 10px;
      padding: 10px 16px; margin-bottom: 20px;
      font-size: 0.85rem; backdrop-filter: blur(4px);
    }
    #conn-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--yellow); flex-shrink: 0;
      transition: background .4s;
    }
    #conn-dot.ok  { background: var(--green); }
    #conn-dot.err { background: var(--red);   }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.15);
    }
    .card h2 { color: var(--purple); font-size: 1.15rem; margin-bottom: 18px; }

    /* ── Form ── */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 600; color: #444; margin-bottom: 5px; }
    .field input,
    .field textarea {
      width: 100%; padding: 9px 12px;
      border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 0.93rem; transition: border-color .25s;
      font-family: inherit;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--purple); }
    .field textarea { resize: vertical; min-height: 62px; }

    /* ── Button ── */
    .btn {
      display: block; width: 100%;
      padding: 12px; border: none; border-radius: 9px;
      font-size: 0.97rem; font-weight: 700; cursor: pointer;
      transition: transform .2s, opacity .2s;
    }
    .btn:hover   { transform: translateY(-2px); }
    .btn:active  { transform: none; }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, var(--purple), var(--violet)); color: #fff; }
    .btn-muted   { background: #e9ecef; color: #555; margin-top: 10px; }

    /* ── Decision panel ── */
    #result {
      display: none; padding: 16px; border-radius: 10px;
      border: 2px solid transparent; margin-bottom: 16px;
      font-size: 0.9rem; line-height: 1.6;
    }
    #result.show    { display: block; }
    #result.pending  { background: #fff8e1; border-color: var(--yellow); color: #6d4c00; }
    #result.approved { background: #e8f5e9; border-color: var(--green);  color: #1b5e20; }
    #result.rejected { background: #fce4ec; border-color: var(--red);    color: #880e1f; }

    .result-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .result-row   { display: flex; justify-content: space-between; padding: 3px 0; }
    .result-row span:first-child { font-weight: 600; }

    .risk-bar-wrap { margin: 10px 0; }
    .risk-bar-bg   { background: #e0e0e0; border-radius: 6px; height: 10px; overflow: hidden; }
    .risk-bar-fill { height: 100%; border-radius: 6px; transition: width .6s; }

    /* ── Agent cards ── */
    #agents { display: none; gap: 10px; margin-top: 14px; }
    #agents.show { display: flex; }
    .agent-chip {
      flex: 1; padding: 10px; border-radius: 10px;
      border: 2px solid #e0e0e0; text-align: center;
      font-size: 0.78rem;
    }
    .agent-chip .chip-name  { font-weight: 700; color: #333; margin-bottom: 4px; }
    .agent-chip .chip-score { font-size: 1.1rem; font-weight: 800; }
    .agent-chip .chip-flag  { margin-top: 3px; font-size: 0.7rem; color: #888; }
    .agent-chip.ok  { border-color: var(--green); background: #f0fff4; }
    .agent-chip.bad { border-color: var(--red);   background: #fff5f5; }

    /* ── Metrics ── */
    .metrics { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 16px; }
    .metric { background: var(--bg); border-radius: 10px; padding: 14px; text-align: center; }
    .metric-value { font-size: 1.8rem; font-weight: 800; color: var(--purple); }
    .metric-label { font-size: 0.74rem; color: #777; margin-top: 4px; }

    /* ── Logs ── */
    .logs {
      background: #1a1a2e; border-radius: 10px;
      padding: 14px; max-height: 280px;
      overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.78rem;
      margin-top: 4px;
    }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #2a2a3e; }
    .log-entry:last-child { border: none; }
    .log-entry.success { color: #69ff83; }
    .log-entry.error   { color: #ff6b6b; }
    .log-entry.info    { color: #79d4f1; }
    .log-entry.warn    { color: #ffd56b; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🤖 AGFS — Autonomous Financial Governance System</h1>
    <p>AI-Powered Risk Assessment · Multi-Agent Consensus · GenLayer-Compatible</p>
  </div>

  <!-- Connection status -->
  <div id="conn-banner">
    <div id="conn-dot"></div>
    <span id="conn-text">Connecting to backend…</span>
    <span style="margin-left:auto;opacity:.7;font-size:.75rem" id="conn-url"></span>
  </div>

  <div class="grid">

    <!-- Left: form -->
    <div class="card">
      <h2>📝 Transaction Intent</h2>

      <div class="field">
        <label>User Address</label>
        <input id="user_address" placeholder="0xUser123…" value="0xUser123" />
      </div>
      <div class="field">
        <label>Amount (USD)</label>
        <input id="amount" type="number" min="0" step="any" placeholder="500" value="500" />
      </div>
      <div class="field">
        <label>Recipient Address</label>
        <input id="recipient" placeholder="0xRecipient456…" value="0xRecipient456" />
      </div>
      <div class="field">
        <label>Intent Description</label>
        <textarea id="intent_text">Pay monthly service invoice</textarea>
      </div>

      <button class="btn btn-primary" id="submit-btn" onclick="submitTransaction()">🚀 Submit for Governance</button>
    </div>

    <!-- Right: decision -->
    <div class="card">
      <h2>📊 Governance Decision</h2>

      <div id="result"></div>

      <!-- Agent breakdown -->
      <div id="agents">
        <!-- filled by JS -->
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-value" id="total_tx">0</div>
          <div class="metric-label">Total Transactions</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="approval_rate">—</div>
          <div class="metric-label">Approval Rate</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Logs -->
  <div class="card">
    <h2>📜 Governance Logs</h2>
    <div id="logs" class="logs"></div>
    <button class="btn btn-muted" onclick="clearLogs()">Clear Logs</button>
  </div>

</div>

<script>
  // ═══════════════════════════════════════════════════════════
  //  CONFIG
  //  Priority: window.AGFS_API_BASE  →  auto-detect (same origin
  //  if served by FastAPI, otherwise Railway URL from build)
  // ═══════════════════════════════════════════════════════════
  const RAILWAY_URL = 'https://autonomous-financial-governance-system-agfs-production.up.railway.app';

  function resolveApiBase() {
    if (window.AGFS_API_BASE) return window.AGFS_API_BASE.replace(/\/$/, '');
    // If the page is served from a real host (not file://) and it's NOT
    // a static CDN / Vercel domain, assume same-origin FastAPI.
    const host = location.hostname;
    if (host && host !== 'localhost' && !host.endsWith('.vercel.app') && !host.endsWith('.github.io') && !host.endsWith('.netlify.app')) {
      return location.origin;
    }
    return RAILWAY_URL;
  }

  const API_BASE = resolveApiBase();

  // ── state ─────────────────────────────────────────────────
  let totalTx    = 0;
  let approvedTx = 0;

  // ── boot ──────────────────────────────────────────────────
  document.getElementById('conn-url').textContent = API_BASE;
  addLog('🟢 AGFS frontend loaded.', 'info');
  addLog(`🔗 Backend target: ${API_BASE}`, 'info');
  testConnection();

  // ═══════════════════════════════════════════════════════════
  //  Connection test
  // ═══════════════════════════════════════════════════════════
  async function testConnection() {
    const dot  = document.getElementById('conn-dot');
    const text = document.getElementById('conn-text');
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(`${API_BASE}/health`, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
      if (r.ok) {
        dot.className  = 'ok';
        text.textContent = '✅ Backend connected';
        addLog('✅ Health check passed.', 'success');
      } else {
        throw new Error(`HTTP ${r.status}`);
      }
    } catch (e) {
      dot.className  = 'err';
      text.textContent = `⚠️ Backend unreachable — ${e.message}`;
      addLog(`⚠️ Health check failed: ${e.message}`, 'error');
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  Submit transaction
  // ═══════════════════════════════════════════════════════════
  async function submitTransaction() {
    const user_address = document.getElementById('user_address').value.trim();
    const amount       = parseFloat(document.getElementById('amount').value);
    const recipient    = document.getElementById('recipient').value.trim();
    const intent_text  = document.getElementById('intent_text').value.trim();

    if (!user_address || !amount || !recipient || !intent_text) {
      addLog('❌ Please fill all fields.', 'error');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Processing…';

    showResult('pending', '<div class="result-title">🔄 Analysing…</div><p>Running multi-agent risk assessment…</p>');
    hideAgents();
    addLog(`📤 Intent: "${intent_text.slice(0,60)}…" | $${amount} → ${recipient}`, 'info');

    try {
      const res = await fetch(`${API_BASE}/intent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_address, amount, recipient, intent_text }),
        signal: (() => { const c = new AbortController(); setTimeout(() => c.abort(), 30000); return c.signal; })(),
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Server error ${res.status}: ${txt.slice(0,200)}`);
      }

      const data = await res.json();
      totalTx++;
      if (data.approved) approvedTx++;
      updateMetrics();

      renderDecision(data);
      if (data.agents) renderAgents(data.agents);

      addLog(
        `${data.approved ? '✅ APPROVED' : '❌ REJECTED'} | Risk: ${(data.risk_score*100).toFixed(1)}% | Confidence: ${(data.consensus_confidence*100).toFixed(0)}%`,
        data.approved ? 'success' : 'error'
      );
      if (data.tx_hash) addLog(`🔗 Tx hash: ${data.tx_hash}`, 'success');

    } catch (e) {
      showResult('rejected',
        `<div class="result-title">⚠️ Connection Error</div>
         <p>${e.message}</p>
         <p style="margin-top:8px;font-size:.8rem;opacity:.7">
           Check that Railway backend is running and CORS is enabled.<br>
           Target: <code>${API_BASE}</code>
         </p>`
      );
      addLog(`❌ ${e.message}`, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 Submit for Governance';
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  Render helpers
  // ═══════════════════════════════════════════════════════════
  function showResult(cls, html) {
    const el = document.getElementById('result');
    el.className = `result ${cls} show`;
    el.innerHTML = html;
  }

  function renderDecision(data) {
    const riskPct   = (data.risk_score * 100).toFixed(1);
    const riskColor = data.risk_score < 0.35 ? '#28a745' : data.risk_score < 0.65 ? '#ff9800' : '#dc3545';
    const confPct   = ((data.consensus_confidence ?? 0) * 100).toFixed(0);
    const txBadge   = data.tx_hash
      ? `<span style="display:inline-block;margin-top:8px;padding:4px 10px;border-radius:6px;background:var(--green);color:#fff;font-size:.8rem">🔗 Tx: ${data.tx_hash.slice(0,18)}…</span>`
      : '';

    showResult(data.approved ? 'approved' : 'rejected', `
      <div class="result-title">${data.approved ? '✅ APPROVED' : '❌ REJECTED'}</div>
      <div class="risk-bar-wrap">
        <div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px">
          <span>Risk Score</span><span style="font-weight:700;color:${riskColor}">${riskPct}%</span>
        </div>
        <div class="risk-bar-bg">
          <div class="risk-bar-fill" style="width:${riskPct}%;background:${riskColor}"></div>
        </div>
      </div>
      <div class="result-row"><span>Status</span><span>${data.status}</span></div>
      <div class="result-row"><span>Confidence</span><span>${confPct}%</span></div>
      <div style="margin-top:8px;font-size:.82rem;color:#555">${data.reason}</div>
      ${txBadge}
    `);
  }

  function renderAgents(agents) {
    const wrap = document.getElementById('agents');
    wrap.innerHTML = agents.map(a => {
      const pct = (a.score * 100).toFixed(0);
      const cls = a.approve ? 'ok' : 'bad';
      const icon = a.approve ? '✅' : '❌';
      return `
        <div class="agent-chip ${cls}">
          <div class="chip-name">${a.agent}</div>
          <div class="chip-score" style="color:${a.approve?'var(--green)':'var(--red)'}">${icon} ${pct}%</div>
          <div class="chip-flag">${a.reasoning ? a.reasoning.slice(0,60) : (a.flags.join(', ') || '—')}</div>
        </div>`;
    }).join('');
    wrap.className = 'show';
  }

  function hideAgents() {
    const wrap = document.getElementById('agents');
    wrap.innerHTML = '';
    wrap.className = '';
  }

  function updateMetrics() {
    document.getElementById('total_tx').textContent = totalTx;
    document.getElementById('approval_rate').textContent =
      totalTx === 0 ? '—' : `${((approvedTx / totalTx) * 100).toFixed(0)}%`;
  }

  // ═══════════════════════════════════════════════════════════
  //  Logging
  // ═══════════════════════════════════════════════════════════
  function addLog(msg, type = 'info') {
    const logs = document.getElementById('logs');
    const el   = document.createElement('div');
    el.className = `log-entry ${type}`;
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logs.prepend(el);
    while (logs.children.length > 80) logs.removeChild(logs.lastChild);
  }

  function clearLogs() {
    document.getElementById('logs').innerHTML = '';
    addLog('Logs cleared.', 'warn');
    addLog(`🔗 Backend: ${API_BASE}`, 'info');
  }
</script>
</body>
</html>
