<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGFS — Autonomous Financial Governance System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #667eea; --violet: #764ba2;
      --green: #28a745; --red: #dc3545; --yellow: #ffc107;
      --card: #ffffff; --bg: #f4f6fb; --radius: 14px;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--purple) 0%, var(--violet) 100%);
      min-height: 100vh; padding: 24px 16px;
    }
    .container { max-width: 1040px; margin: 0 auto; }
    .header { text-align: center; color: #fff; margin-bottom: 24px; }
    .header h1 { font-size: 1.9rem; font-weight: 700; }
    .header p  { margin-top: 6px; opacity: .85; font-size: .95rem; }

    #status-bar {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; border-radius: 10px; padding: 10px 16px;
      margin-bottom: 20px; font-size: .85rem; backdrop-filter: blur(4px);
    }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--yellow); flex-shrink: 0; transition: background .4s;
    }
    #status-dot.ok  { background: var(--green); }
    #status-dot.err { background: var(--red); }
    #status-addr { margin-left: auto; opacity: .7; font-size: .72rem; font-family: monospace; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: 0 8px 28px rgba(0,0,0,.15); }
    .card h2 { color: var(--purple); font-size: 1.1rem; margin-bottom: 18px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; color: #555; margin-bottom: 5px; }
    .field input, .field textarea {
      width: 100%; padding: 9px 12px;
      border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: .92rem; transition: border-color .2s; font-family: inherit;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--purple); }
    .field textarea { resize: vertical; min-height: 58px; }

    .btn {
      display: block; width: 100%; padding: 12px; border: none; border-radius: 9px;
      font-size: .97rem; font-weight: 700; cursor: pointer; transition: transform .2s, opacity .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, var(--purple), var(--violet)); color: #fff; }
    .btn-muted { background: #e9ecef; color: #555; margin-top: 10px; }

    #result {
      display: none; padding: 16px; border-radius: 10px;
      border: 2px solid transparent; margin-bottom: 14px; font-size: .9rem; line-height: 1.6;
    }
    #result.show     { display: block; }
    #result.pending  { background: #fff8e1; border-color: var(--yellow); color: #6d4c00; }
    #result.approved { background: #e8f5e9; border-color: var(--green);  color: #1b5e20; }
    #result.rejected { background: #fce4ec; border-color: var(--red);    color: #880e1f; }
    .result-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }

    .explorer-link {
      display: inline-block; margin-top: 8px; padding: 7px 12px;
      background: #1a1a2e; color: #79d4f1 !important; border-radius: 6px;
      font-family: monospace; font-size: .72rem; text-decoration: none;
      word-break: break-all; transition: background .2s;
    }
    .explorer-link:hover { background: #2a2a4e; }
    .explorer-link::before { content: "🔗 "; }

    /* Single consensus verdict card */
    #verdict { display: none; margin-top: 14px; }
    #verdict.show { display: block; }
    .verdict-card {
      padding: 14px; border-radius: 10px; border: 2px solid #e0e0e0;
    }
    .verdict-card.ok  { border-color: var(--green); background: #f0fff4; }
    .verdict-card.bad { border-color: var(--red);   background: #fff5f5; }
    .verdict-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .verdict-label { font-weight: 700; font-size: .85rem; color: #333; }
    .verdict-call { font-weight: 800; font-size: .9rem; }
    .verdict-score-bar-bg { background: #e0e0e0; border-radius: 5px; height: 7px; overflow: hidden; margin: 8px 0; }
    .verdict-score-bar-fill { height: 100%; border-radius: 5px; transition: width .5s; }
    .verdict-reasoning { font-size: .82rem; color: #555; line-height: 1.45; }
    .verdict-note { font-size: .7rem; color: #999; margin-top: 8px; line-height: 1.4; }

    .summary-row { display: flex; gap: 12px; margin-top: 10px; font-size: .82rem; }
    .summary-chip { background: var(--bg); padding: 6px 12px; border-radius: 8px; font-weight: 600; color: var(--purple); }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .metric { background: var(--bg); border-radius: 10px; padding: 14px; text-align: center; }
    .metric-value { font-size: 1.7rem; font-weight: 800; color: var(--purple); }
    .metric-label { font-size: .72rem; color: #777; margin-top: 4px; }

    .logs {
      background: #1a1a2e; border-radius: 10px; padding: 14px;
      max-height: 260px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: .77rem; margin-top: 4px;
    }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #2a2a3e; }
    .log-entry:last-child { border: none; }
    .log-entry.success { color: #69ff83; }
    .log-entry.error   { color: #ff6b6b; }
    .log-entry.info    { color: #79d4f1; }
    .log-entry.warn    { color: #ffd56b; }
    .logs a { color: #79d4f1; text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🤖 AGFS — Autonomous Financial Governance System</h1>
    <p>GenLayer Intelligent Contract · Optimistic Democracy Consensus · Direct On-Chain Calls</p>
  </div>

  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-text">Connecting to GenLayer studionet…</span>
    <span id="status-addr"></span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>📝 Transaction Intent</h2>
      <div class="field">
        <label>Amount (USD)</label>
        <input id="amount" type="number" value="500" min="0" />
      </div>
      <div class="field">
        <label>Recipient Address</label>
        <input id="recipient" value="0xEmployee01" />
      </div>
      <div class="field">
        <label>Intent Description</label>
        <textarea id="intent">Pay monthly service invoice</textarea>
      </div>
      <button class="btn btn-primary" id="submit-btn" onclick="submitIntent()">
        🚀 Submit to GenLayer Contract
      </button>
    </div>

    <div class="card">
      <h2>📊 GenLayer Network Consensus Result</h2>
      <div id="result"></div>
      <div id="verdict"></div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-value" id="m-total">—</div>
          <div class="metric-label">On-Chain Intents</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="m-rate">—</div>
          <div class="metric-label">Session Approval Rate</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📜 Logs</h2>
    <div id="logs" class="logs"></div>
    <button class="btn btn-muted" onclick="clearLogs()">Clear</button>
  </div>

</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════════
const CONTRACT_ADDRESS = "0xYOUR_CONTRACT_ADDRESS_HERE";
const EXPLORER_BASE = "https://explorer-studio.genlayer.com/tx/";

import { createClient, createAccount } from "https://esm.sh/genlayer-js@latest";
import { studionet } from "https://esm.sh/genlayer-js@latest/chains";

let account;
let client;

try {
  account = createAccount();
  client = createClient({ chain: studionet, account });
} catch (e) {
  log(`❌ Failed to init client: ${e.message}`, "error");
}

let sessionTotal = 0;
let sessionApproved = 0;

log("🤖 AGFS loaded.", "info");
log(`🔗 Contract: ${CONTRACT_ADDRESS}`, "info");
log(`👛 Session account: ${account ? account.address : "init failed"}`, "info");
pingContract();

async function pingContract() {
  const dot  = document.getElementById("status-dot");
  const text = document.getElementById("status-text");
  const addr = document.getElementById("status-addr");

  try {
    await client.initializeConsensusSmartContract();
    const count = await client.readContract({
      address: CONTRACT_ADDRESS,
      functionName: "get_count",
      args: [],
    });
    dot.className  = "ok";
    text.textContent = "✅ Connected — GenLayer studionet";
    addr.textContent = CONTRACT_ADDRESS.slice(0, 20) + "…";
    document.getElementById("m-total").textContent = String(count);
    log(`✅ Contract live. Total on-chain intents: ${count}`, "success");
  } catch (e) {
    dot.className  = "err";
    text.textContent = "⚠️ Contract unreachable — set CONTRACT_ADDRESS";
    log(`⚠️ Ping failed: ${e.message}`, "warn");
    log("ℹ️  Edit CONTRACT_ADDRESS in index.html after deploying contracts/agfs.py", "info");
  }
}

window.submitIntent = async function () {
  const amount    = document.getElementById("amount").value.trim();
  const recipient = document.getElementById("recipient").value.trim();
  const intent    = document.getElementById("intent").value.trim();

  if (!amount || !recipient || !intent) {
    log("❌ Fill all fields.", "error"); return;
  }
  if (!client) {
    log("❌ GenLayer client not ready.", "error"); return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "⏳ Waiting for consensus…";
  showResult("pending",
    '<div class="result-title">🔄 Submitting to GenLayer…</div>' +
    "<p>GenLayer network validators are independently evaluating this transaction and reaching consensus on-chain.</p>"
  );
  clearVerdict();
  log(`📤 $${amount} → ${recipient} | "${intent.slice(0,50)}"`, "info");

  try {
    const txHash = await client.writeContract({
      address: CONTRACT_ADDRESS,
      functionName: "evaluate_intent",
      args: [recipient, amount, intent],
    });
    const explorerUrl = EXPLORER_BASE + txHash;
    log(`🔗 Tx sent: <a href="${explorerUrl}" target="_blank">${txHash}</a>`, "info");

    showResult("pending",
      '<div class="result-title">⏳ Awaiting finality…</div>' +
      `<a class="explorer-link" href="${explorerUrl}" target="_blank">${txHash}</a>` +
      "<p style='margin-top:8px'>GenLayer validator nodes are independently re-executing the governance evaluation and reaching consensus via Optimistic Democracy.</p>"
    );

    await client.waitForTransactionReceipt({ hash: txHash, status: "FINALIZED" });
    log("✅ Tx finalised.", "success");

    const count    = await client.readContract({
      address: CONTRACT_ADDRESS, functionName: "get_count", args: [],
    });
    const intentId = String(Number(count) - 1);

    const raw    = await client.readContract({
      address: CONTRACT_ADDRESS, functionName: "get_intent", args: [intentId],
    });
    const stored = JSON.parse(raw);
    const result = stored.result;
    const approved = result.status === "APPROVED";

    showResult(
      approved ? "approved" : "rejected",
      `<div class="result-title">${approved ? "✅ APPROVED" : "❌ REJECTED"}</div>
       <div class="summary-row">
         <span class="summary-chip">safety score: ${result.score}/100</span>
         <span class="summary-chip">intent #${intentId}</span>
       </div>
       <a class="explorer-link" href="${explorerUrl}" target="_blank">${txHash}</a>`
    );
    renderVerdict(result, approved);

    sessionTotal++;
    if (approved) sessionApproved++;
    document.getElementById("m-total").textContent = String(count);
    document.getElementById("m-rate").textContent =
      `${Math.round((sessionApproved / sessionTotal) * 100)}%`;

    log(`${approved ? "✅ APPROVED" : "❌ REJECTED"} | score ${result.score} | intent #${intentId}`,
        approved ? "success" : "error");

  } catch (e) {
    showResult("rejected",
      `<div class="result-title">⚠️ Error</div><p>${e.message}</p>`
    );
    log(`❌ ${e.message}`, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "🚀 Submit to GenLayer Contract";
  }
};

function showResult(cls, html) {
  const el = document.getElementById("result");
  el.className = `result ${cls} show`;
  el.innerHTML = html;
}

function renderVerdict(result, approved) {
  const wrap = document.getElementById("verdict");
  const score = result.score;
  const barColor = score >= 65 ? "var(--green)" : score >= 35 ? "var(--yellow)" : "var(--red)";
  wrap.innerHTML = `
    <div class="verdict-card ${approved ? "ok" : "bad"}">
      <div class="verdict-top">
        <span class="verdict-label">GenLayer Network Verdict</span>
        <span class="verdict-call" style="color:${approved ? "var(--green)" : "var(--red)"}">
          ${approved ? "✅ APPROVE" : "❌ REJECT"} · ${score}/100
        </span>
      </div>
      <div class="verdict-score-bar-bg">
        <div class="verdict-score-bar-fill" style="width:${score}%;background:${barColor}"></div>
      </div>
      <div class="verdict-reasoning">${result.reasoning}</div>
      <div class="verdict-note">
        Decided by GenLayer validator consensus (Optimistic Democracy) —
        each validator node independently re-ran this governance evaluation on-chain.
      </div>
    </div>`;
  wrap.className = "show";
}

function clearVerdict() {
  const w = document.getElementById("verdict");
  w.innerHTML = ""; w.className = "";
}

function log(msg, type = "info") {
  const el = document.createElement("div");
  el.className = `log-entry ${type}`;
  el.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
  const logs = document.getElementById("logs");
  logs.prepend(el);
  while (logs.children.length > 100) logs.removeChild(logs.lastChild);
};

window.clearLogs = () => {
  document.getElementById("logs").innerHTML = "";
  log("Logs cleared.", "warn");
};
</script>
</body>
</html>
